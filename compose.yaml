services:
  heron:
    image: ghcr.io/nethercoded/heron:latest
    build: .
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    environment:
      HERON_TIMEZONE: UTC
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    volumes:
      - heron-data:/data
    cap_add:
      - NET_RAW
    healthcheck:
      test: ["CMD", "/usr/local/bin/heron", "version"]
      interval: 1m
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  heron-data:
